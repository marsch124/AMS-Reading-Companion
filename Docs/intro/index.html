<meta name="claude:viewport-fit-sides" content="cover">
<title>Reading Companion Tour</title>
<style>
/* Reading Companion Tour: chapter rail on the left, coach card + a pretend iPhone on the right. Same engine as the other AMS tours.
   Based on AMS Reading Companion 0.7. Update this tour in the release that changes a taught screen. */
:root {
  --bg: #F7F4F8; --panel: #FFFFFF; --fg: #251C2B; --muted: #6E6477; --line: #E6DEEA;
  --accent: #7A508A; --accent-soft: #F0E7F4; --good: #2F7D32; --good-soft: #E6F3E6; --warn: #A8431A;
  --shadow: 0 18px 40px rgba(37,28,43,.2);
  --purple:#7A508A; --red:#CA4A33; --green:#128559; --teal:#058087; --amber:#B37305; --blue:#2466D6; --grey:#666E7A; --pink:#BD3878; --brown:#8C5E33; --indigo:#4B55C4; --sea:#0B7FA8; --lime:#5E8A12;
  --k-kobo:#D95A30; --k-kindle:#2978DE; --k-apple:#78787F; --k-own:#058087;
  --pbg:#FFFFFF; --pgrp:#F2F2F7; --pcell:#FFFFFF; --pink-t:#1C1C1E; --pmuted:#6C6C70; --pline:#E0E0E5; --pfield:rgba(120,120,128,.14); --pplate:#F4F5F7;
  --f-display: "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --f-phone: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#171219; --panel:#221B26; --fg:#F3ECF6; --muted:#B4A8BC; --line:#3A2F40;
  --accent:#CCA8E0; --accent-soft:#33273B; --good:#8FD18F; --good-soft:#1D3320; --warn:#F2A47F;
  --shadow: 0 18px 40px rgba(0,0,0,.55);
  --purple:#CCA8E0; --red:#FF9980; --green:#61D69E; --teal:#5CD1D6; --amber:#F5BF4D; --blue:#85B8FF; --grey:#A8B0BD; --pink:#FA94C2; --brown:#D9AD7A; --indigo:#A3A9FF; --sea:#6CCBEA; --lime:#B5D96B;
  --k-kobo:#F58A5C; --k-kindle:#73B3FF; --k-apple:#A8A8B2; --k-own:#5CD1D6;
  --pbg:#000000; --pgrp:#000000; --pcell:#1C1C1E; --pink-t:#F2F2F7; --pmuted:#9A9AA0; --pline:#333338; --pfield:rgba(120,120,128,.3); --pplate:#2B2C30;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg:#171219; --panel:#221B26; --fg:#F3ECF6; --muted:#B4A8BC; --line:#3A2F40;
  --accent:#CCA8E0; --accent-soft:#33273B; --good:#8FD18F; --good-soft:#1D3320; --warn:#F2A47F;
  --shadow: 0 18px 40px rgba(0,0,0,.55);
  --purple:#CCA8E0; --red:#FF9980; --green:#61D69E; --teal:#5CD1D6; --amber:#F5BF4D; --blue:#85B8FF; --grey:#A8B0BD; --pink:#FA94C2; --brown:#D9AD7A; --indigo:#A3A9FF; --sea:#6CCBEA; --lime:#B5D96B;
  --k-kobo:#F58A5C; --k-kindle:#73B3FF; --k-apple:#A8A8B2; --k-own:#5CD1D6;
  --pbg:#000000; --pgrp:#000000; --pcell:#1C1C1E; --pink-t:#F2F2F7; --pmuted:#9A9AA0; --pline:#333338; --pfield:rgba(120,120,128,.3); --pplate:#2B2C30;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; margin: 0 }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 230px minmax(0,1fr); gap: 22px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }
svg.g { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }

/* Rail */
.rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.brand h1 { font-family: var(--f-display); font-size: 19px; line-height: 1.1; margin: 0; text-wrap: balance }
.brand small { color: var(--muted); font-size: 12px }
.logo { width: 40px; height: 40px; border-radius: 10px; background: var(--purple); color: #fff; display: grid; place-items: center; flex: none }
.chap { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; border: 0; background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.chap:hover { background: var(--accent-soft) }
.chap:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.chap .n { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap }
.chap.cur { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.chap.done .n { color: var(--good) }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 10px 2px 2px }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s }
.railnote { color: var(--muted); font-size: 12px; margin: 4px 2px }

/* Coach */
.main { display: grid; grid-template-columns: minmax(0,1fr); gap: 14px; min-width: 0; align-content: start }
.topnote { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 13.5px }
.coach { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 16px; align-items: center; }
.coach .eyebrow { grid-column: 1 / -1; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; display: flex; gap: 8px; align-items: center }
.coach .eyebrow .kind { color: var(--muted); font-weight: 500 }
.coach h2 { font-family: var(--f-display); font-size: 23px; line-height: 1.2; margin: 0; text-wrap: balance }
.coach p { margin: 4px 0 0; color: var(--fg); max-width: 62ch }
.coach .btns { display: flex; gap: 8px; align-items: center }
.btn { font: inherit; font-weight: 600; border-radius: 9px; padding: 8px 16px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer }
.btn.main-b { background: #7A508A; border-color: #7A508A; color: #fff }
.btn.main-b:disabled { opacity: .45; cursor: default }
.btn.ghost { border-color: transparent; color: var(--muted) }
.answers { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px }
.ans { font: inherit; padding: 8px 14px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; text-align: left }
.ans:hover { border-color: var(--accent) }
.ans.right { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 600 }
.ans.wrong { border-color: var(--warn); color: var(--warn); text-decoration: line-through }
.feedback { grid-column: 1 / -1; font-weight: 600; color: var(--good); min-height: 1.4em; margin: 0 }
.feedback.no { color: var(--warn) }

/* Stage = pretend iPhone, 390 x 760, scaled to fit */
.stagebox { position: relative; width: min(100%, 390px); aspect-ratio: 390 / 760; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 6px #1f1f23, var(--shadow); justify-self: center; background: var(--pbg) }
.stage { position: absolute; left: 0; top: 0; width: 390px; height: 760px; transform-origin: 0 0; font-family: var(--f-phone); font-size: 15px; line-height: 1.3; color: var(--pink-t); background: var(--pbg); overflow: hidden; -webkit-user-select: none; user-select: none }
.stage button { font: inherit; color: inherit }
.stage input { font: inherit; color: var(--pink-t); -webkit-user-select: text; user-select: text }
.sbar { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 6px 34px; font-weight: 600; font-size: 15px; z-index: 40; pointer-events: none; background: var(--pbg) }
.sbar .bat { width: 25px; height: 12px; border: 1.5px solid var(--pink-t); border-radius: 4px; position: relative; opacity: .8 }
.sbar .bat::after { content: ""; position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: 70%; background: var(--pink-t); border-radius: 2px }
.scr { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 94px 0 40px; scrollbar-width: none }
.scr::-webkit-scrollbar { display: none }
.pnav { position: absolute; top: 44px; left: 0; right: 0; height: 44px; display: flex; align-items: center; padding: 0 10px; z-index: 35; background: var(--pbg) }
.ptitle { position: absolute; left: 0; right: 0; text-align: center; font-weight: 600; font-size: 17px; pointer-events: none }
.ptools { margin-left: auto; display: flex; gap: 0; z-index: 2 }
.ibtn { border: 0; background: none; color: var(--purple); padding: 6px; border-radius: 10px; display: grid; place-items: center; cursor: pointer }
.ibtn svg { width: 25px; height: 25px }
.pback { border: 0; background: none; color: var(--purple); display: flex; align-items: center; font-size: 17px; cursor: pointer; padding: 6px 2px; z-index: 2; max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.pback svg { width: 22px; height: 22px }

/* Shelves */
.shelf { margin: 0 0 12px }
.shh { display: flex; align-items: baseline; gap: 6px; width: 100%; border: 0; background: none; padding: 0 12px 5px; text-align: left; cursor: pointer }
.shh b { font-size: 17px; font-weight: 600 }
.shh small { color: var(--pmuted); font-size: 13px }
.shh svg { width: 14px; height: 14px; margin-left: auto; align-self: center }
.shh:disabled { cursor: default }
.hrow { display: flex; gap: 8px; overflow-x: auto; padding: 0 12px; scrollbar-width: none }
.hrow::-webkit-scrollbar { display: none }
.tile { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; flex: none }
.cv { position: relative; width: var(--w); height: calc(var(--w) * 1.5); border-radius: 4px; overflow: hidden; color: #fff; padding: calc(var(--w) * .08); display: flex; flex-direction: column; gap: 2px; box-shadow: inset 0 0 0 .5px rgba(128,128,128,.45); flex: none; text-align: left }
.cv b { font-weight: 600; line-height: 1.12; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden }
.cv i { font-style: normal; opacity: .85; line-height: 1.1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.marks { display: flex; gap: 3px; align-items: center; height: 13px; margin-top: 3px }
.marks svg { width: 13px; height: 13px }
.d8 { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none }
.wnc { display: flex; gap: 10px; align-items: flex-start; margin: 0 12px 12px; padding: 10px; background: var(--pplate); border-radius: 10px }
.wnc .go { display: flex; gap: 10px; align-items: flex-start; flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: left; cursor: pointer }
.wnc .t1 { font-size: 15px; font-weight: 700; color: var(--purple) }
.wnc .t2 { font-size: 17px; font-weight: 600; line-height: 1.2 }
.wnc .t3 { font-size: 13px; color: var(--pmuted); line-height: 1.25 }
.lk { border: 0; background: none; color: var(--purple); font-weight: 600; font-size: 13px; cursor: pointer; padding: 2px }
.pnote { margin: 0 12px 12px; padding: 10px; background: var(--pplate); border-radius: 10px; font-size: 15px }

/* Pages */
.pad { padding: 4px 18px 0 }
.bhead { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px }
.bhead h2 { margin: 0; font-size: 20px; line-height: 1.2; font-weight: 700; overflow-wrap: anywhere }
.bhead .au { color: var(--pmuted) }
.bhead .fn { font-size: 13px; color: var(--pmuted) }
.flag { font-size: 13px; font-weight: 600 }
.seg3 { display: flex; gap: 6px; margin-bottom: 14px }
.seg3 button { flex: 1; border: 0; border-radius: 8px; padding: 7px 0; font-size: 15px; font-weight: 600; cursor: pointer; color: var(--purple); background: rgba(122,80,138,.14) }
.seg3 button.on { background: #7A508A; color: #fff }
.lnk3 { font-size: 13px; font-weight: 600; color: var(--brown); margin-bottom: 14px; display: flex; gap: 10px; align-items: baseline }
.lnk3 button { border: 0; background: none; color: var(--brown); font-weight: 600; font-size: 13px; cursor: pointer; padding: 0 }
.lnk3 span { color: var(--pmuted); font-weight: 400 }
.blk { margin-bottom: 14px }
.blk h3 { margin: 0 0 5px; font-size: 17px; font-weight: 600 }
.blk .sm { font-size: 13px; color: var(--pmuted) }
.stars { display: flex; gap: 3px; margin: 2px 0 4px }
.stars button { border: 0; background: none; padding: 0; display: grid; cursor: default }
.stars svg { fill: none; stroke: var(--amber); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round }
.stars svg.on { fill: var(--amber) }
.edit { border: 0; background: none; color: var(--amber); font-weight: 600; font-size: 15px; cursor: pointer; padding: 0 }
.hdl { display: flex; align-items: baseline; justify-content: space-between }
.nrow { display: flex; gap: 8px; align-items: center; width: 100%; border: 0; background: none; text-align: left; padding: 0; cursor: pointer }
.fbtn { border: 0; color: #fff; font-weight: 600; border-radius: 8px; padding: 6px 12px; font-size: 15px; cursor: pointer }
.crow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px }
.crow .sp { flex: 1 }
.openb { display: inline-flex; align-items: center; gap: 5px; border: 0; background: #7A508A; color: #fff; font-weight: 600; font-size: 15px; border-radius: 16px; padding: 5px 12px; cursor: pointer }
.openb svg { width: 18px; height: 18px }
.alink { display: block; color: var(--blue); margin: 2px 0; cursor: pointer; border: 0; background: none; padding: 0; text-align: left; font-size: 17px }
.rmv { border: 0; background: none; color: var(--red); font-size: 17px; cursor: pointer; padding: 0; margin-top: 6px }
.big { font-size: 34px; font-weight: 700; margin: 0 0 8px; padding: 0 12px }
.frow { display: flex; gap: 6px; padding: 0 12px; margin-bottom: 8px; position: relative }
.fsel { display: inline-flex; align-items: center; gap: 3px; border: 0; background: none; color: var(--green); font-size: 15px; cursor: pointer; padding: 4px 2px }
.fsel svg { width: 12px; height: 12px }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 10px; padding: 0 14px }
.gcap { font-size: 12px; line-height: 1.2; width: 92px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }

.rline { display: flex; align-items: center; gap: 8px; margin: 0 12px 12px }
.rline .go { flex: 1; border: 0; background: none; text-align: left; cursor: pointer; padding: 0; font-size: 15px; font-weight: 600; color: var(--pink) }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px }
.chip { border: 1.5px solid var(--pline); border-radius: 14px; padding: 4px 10px; font-size: 14px; background: none; cursor: pointer; display: inline-flex; gap: 5px; align-items: center }
.chip.on { background: var(--purple); border-color: var(--purple); color: #fff }
.qod { display: block; width: calc(100% - 24px); margin: 0 12px 12px; padding: 10px; border-radius: 10px; background: var(--pplate); border: 0; text-align: left; cursor: pointer }
.card2 { margin: 0 12px 12px; padding: 10px; border-radius: 10px; background: var(--pplate); text-align: center }
.nrow2 { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 8px 18px; border-top: 1px solid var(--pline); cursor: pointer }
.wall { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 0 12px }
.hbar { height: 8px; border-radius: 4px; background: var(--pline); overflow: hidden }
.hbar i { display: block; height: 100%; background: var(--purple) }
.fsel.pill { border: 1.5px solid currentColor; border-radius: 14px; padding: 3px 9px; font-size: 14px }
.fsel.pill.on { background: var(--green); border-color: var(--green); color: #fff }

/* Sheets */
.dim { position: absolute; inset: 0; background: rgba(0,0,0,.35) }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 34px; border-radius: 22px 22px 0 0; background: var(--pbg); overflow: hidden; box-shadow: 0 -8px 30px rgba(0,0,0,.3) }
.sheet.grp { background: var(--pgrp) }
.sheet .scr { padding-top: 58px }
.snav { position: absolute; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: inherit; z-index: 5 }
.snav .st { position: absolute; left: 0; right: 0; text-align: center; font-weight: 600; font-size: 17px; pointer-events: none }
.hb { border: 0; background: none; font-weight: 600; font-size: 17px; cursor: pointer; padding: 6px 4px; border-radius: 8px; color: var(--purple); z-index: 2; display: flex; gap: 4px; align-items: center }
.hb.fill { color: #fff; padding: 6px 14px; border-radius: 8px; font-size: 16px }
.hb svg { width: 18px; height: 18px }
.cell { background: var(--pcell); border-radius: 10px; margin: 0 16px 16px; overflow: hidden }
.cell > * + * { border-top: 1px solid var(--pline) }
.fi { width: 100%; min-height: 44px; border: 0; background: none; padding: 0 14px; font-size: 17px; outline: none }
.srow { display: flex; align-items: center; gap: 10px; padding: 8px 14px; min-height: 44px; width: 100%; border: 0; background: none; text-align: left; font-size: 17px; cursor: pointer }
.srow .sub { font-size: 13px; color: var(--pmuted); display: block }
.srow .sp { flex: 1 }
.ghd { margin: 0 32px 6px; font-weight: 700; font-size: 15px }
.gft { margin: -6px 32px 16px; font-size: 13px; color: var(--pmuted) }
.warnc { color: var(--red); font-size: 15px; padding: 10px 14px }
.msg { color: var(--red); font-size: 13px; padding: 6px 14px }
.sfield { display: flex; align-items: center; gap: 8px; background: var(--pplate); border-radius: 8px; padding: 0 10px; margin: 0 18px 10px }
.sfield svg { width: 18px; height: 18px; color: var(--purple) }
.sfield input { flex: 1; border: 0; background: none; outline: none; min-height: 38px; font-size: 17px }
.xr { border: 0; background: none; color: var(--pmuted); display: grid; padding: 2px; cursor: pointer }
.xr svg { width: 18px; height: 18px }
.rres { display: flex; gap: 10px; align-items: center; width: 100%; border: 0; background: none; text-align: left; padding: 6px 18px; cursor: pointer }
.rres b { display: block; font-size: 17px; line-height: 1.2 }
.rres small { color: var(--pmuted); font-size: 13px }
.menu { position: absolute; z-index: 200; background: var(--pcell); border: 1px solid var(--pline); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.3); min-width: 190px; overflow: hidden }
.menu button { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left; padding: 11px 14px; font-size: 16px; cursor: pointer }
.menu button + button { border-top: 1px solid var(--pline) }
.menu button .ck { width: 16px; height: 16px; flex: none }
.dlg { position: absolute; inset: 0; z-index: 300; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; padding: 12px }
.dlg .box { width: 100%; background: var(--pcell); border-radius: 14px; padding: 14px; text-align: center }
.dlg .box p { margin: 0 0 10px; font-size: 14px; color: var(--pmuted) }
.dlg .box button { display: block; width: 100%; border: 0; background: none; padding: 11px; font-size: 18px; cursor: pointer; border-top: 1px solid var(--pline) }
.cam { height: 150px; border-radius: 12px; background: #1b1b1f; color: #bbb; display: grid; place-items: center; text-align: center; font-size: 13px; padding: 14px; margin-bottom: 10px }
.cam svg { width: 56px; height: 36px; fill: none; stroke: #bbb; stroke-width: 1.9; stroke-linecap: round }
.resbox { padding: 10px; background: var(--pplate); border-radius: 12px; margin-top: 10px }
.resbox h4 { margin: 0 0 6px; font-size: 17px }
.fullb { display: block; width: 100%; border: 0; color: #fff; font-weight: 600; font-size: 16px; padding: 9px; border-radius: 8px; cursor: pointer; margin-top: 8px }
.toast { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); background: #3b2d44; color: #fff; font-weight: 600; font-size: 13px; padding: 7px 14px; border-radius: 18px; z-index: 400; animation: pop .3s; max-width: 340px; text-align: center }
.sf { position: absolute; inset: 0; background: var(--pgrp) }
.sfbar { position: absolute; top: 44px; left: 0; right: 0; height: 46px; display: grid; place-items: center; padding: 0 16px }
.sfurl { background: var(--pfield); border-radius: 10px; padding: 6px 14px; font-size: 14px; color: var(--pmuted); width: 100% ; text-align: center }
.sfpage { position: absolute; top: 96px; left: 0; right: 0; bottom: 64px; padding: 18px; overflow: hidden }
.sfpage h2 { font-size: 22px; margin: 0 0 2px }
.sfpage .ln { height: 9px; background: var(--pline); border-radius: 5px; margin: 8px 0 }
.sftool { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; justify-content: center; border-top: 1px solid var(--pline); background: var(--pbg) }
.apps { display: flex; gap: 14px; padding: 10px 16px; overflow: hidden }
.app { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; width: 62px; cursor: pointer; color: var(--pmuted) }
.app .tl { width: 54px; height: 54px; border-radius: 13px; background: var(--pplate); display: grid; place-items: center; color: var(--pmuted) }
.app .tl svg { width: 26px; height: 26px }
.app.me .tl { background: #7A508A; color: #fff }
.app.me { color: var(--pink-t); font-weight: 600 }
.card { padding: 14px 16px }

/* ---------- Tour engine (reusable) ---------- */
let ci = 0, si = 0, solved = false, targetOff = false;
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
let doneChapters = new Set(JSON.parse(store.get('readingtour-done') || '[]'));

function emit(name, data) {
  const st = LESSONS[ci]?.steps[si]; if (!st || solved || st.kind !== 'try') return;
  if (st.on && st.on[name]) { markTarget(st.on[name]); }
  if ((st.wait === name || st.alt === name) && (!st.when || st.when(data))) succeed(typeof st.ok === 'function' ? st.ok(data) : st.ok);
}
function succeed(msg) {
  solved = true; targetOff = true; const fb = document.getElementById('fb'); if (fb) { fb.textContent = '\u2713 ' + msg; fb.className = 'feedback'; }
  const nx = document.getElementById('next'); if (nx) { nx.disabled = false; nx.focus({ preventScroll: true }); }
  markTarget();
}
let curTarget = null;
function markTarget(t) {
  if (t !== undefined) curTarget = t;
  document.querySelectorAll('.target').forEach(e => e.classList.remove('target'));
  if (!curTarget || targetOff) return;
  const sheets = document.querySelectorAll('#stage .sheet'), scope = sheets.length ? sheets[sheets.length - 1] : document.getElementById('stage');
  const q = n => scope.querySelector(`[data-t="${CSS.escape(n)}"]`);
  // If the thing to tap is out of sight (a stray press opened or closed a page), point at the step's own first target, else at the way back.
  const first = LESSONS[ci] && LESSONS[ci].steps[si] && LESSONS[ci].steps[si].target;
  const el = q(curTarget) || (first && first !== curTarget ? q(first) : null) || scope.querySelector('[data-back]') || scope.querySelector('[data-close]');
  if (el) {
    el.classList.add('target');
    const k = document.getElementById('stagebox').clientWidth / 390;
    const hr = el.closest('.hrow'); if (hr) { const r = el.getBoundingClientRect(), s = hr.getBoundingClientRect(); if (r.left < s.left || r.right > s.right) hr.scrollLeft += (r.left - s.left - 12 * k) / k; }
    const sc = el.closest('.scr');
    if (sc) { const r = el.getBoundingClientRect(), s = sc.getBoundingClientRect();
      if (r.top < s.top + 96 * k || r.bottom > s.bottom - 30 * k) sc.scrollTop += (r.top - s.top - 130 * k) / k; }
  }
}
function renderRail() {
  const total = LESSONS.reduce((n, l) => n + l.steps.length, 0);
  const before = LESSONS.slice(0, ci).reduce((n, l) => n + l.steps.length, 0) + si;
  document.getElementById('rail').innerHTML = `<div class="brand"><span class="logo">${icon('book')}</span><div><h1>Reading Companion Tour</h1><small>Learn the app in about 30 minutes</small></div></div>
    ${LESSONS.map((l, i) => `<button class="chap ${i === ci ? 'cur' : ''} ${doneChapters.has(i) ? 'done' : ''}" data-ch="${i}">${icon(l.icon)}<span>${l.title}</span><span class="n">${doneChapters.has(i) ? '\u2713' : l.steps.length + ' steps'}</span></button>`).join('')}
    <button class="chap ${ci === LESSONS.length ? 'cur' : ''}" data-ch="${LESSONS.length}">${icon('check')}<span>Now on your devices</span></button>
    <div class="bar"><i style="width:${Math.round(100 * Math.min(before, total) / total)}%"></i></div>
    <p class="railnote">Practice copy with made-up books. Based on AMS Reading Companion 0.7.</p>`;
}
document.getElementById('rail').addEventListener('click', e => { const b = e.target.closest('[data-ch]'); if (b) goChapter(+b.dataset.ch); });

function goChapter(i) {
  ci = i; si = 0; clearTimers(); S = START();
  renderStep();
}
function renderStep() {
  renderRail();
  const coach = document.getElementById('coach'), fin = document.getElementById('finish');
  if (ci >= LESSONS.length) { renderFinish(); coach.hidden = true; return; }
  coach.hidden = false; fin.hidden = true;
  const L = LESSONS[ci], st = L.steps[si];
  solved = st.kind === 'look'; targetOff = false;
  S = START(); if (st.setup) st.setup();
  S.toast = ''; renderStage.scrolls = {}; renderStage.keys = {};
  const kindName = { look: 'Look', try: 'Try it', check: 'Check' }[st.kind];
  coach.innerHTML = `<div class="eyebrow">${icon(L.icon)} ${esc(L.title)} <span class="kind">\u00b7 ${kindName} \u00b7 step ${si + 1} of ${L.steps.length}</span></div>
    <div><h2>${esc(st.head)}</h2><p>${esc(st.text)}</p>${st.hint ? `<p style="color:var(--muted);font-size:13px">${esc(st.hint)}</p>` : ''}</div>
    <div class="btns">${ci + si > 0 ? '<button class="btn ghost" id="back">Back</button>' : ''}<button class="btn main-b" id="next" ${solved ? '' : 'disabled'}>${si === L.steps.length - 1 ? 'Finish chapter' : 'Next'}</button></div>
    ${st.kind === 'check' ? `<div class="answers">${st.answers.map((a, i) => `<button class="ans" data-a="${i}">${esc(a)}</button>`).join('')}</div>` : ''}
    <p class="feedback" id="fb"></p>`;
  curTarget = st.target || null;
  renderStage();
  if (st.kind === 'check') coach.querySelectorAll('.ans').forEach(b => b.onclick = () => {
    const fb = document.getElementById('fb');
    if (+b.dataset.a === st.right) { coach.querySelectorAll('.ans').forEach(x => x.disabled = true); b.classList.add('right'); succeed(st.ok); }
    else { b.classList.add('wrong'); fb.textContent = 'Not quite. Try another answer.'; fb.className = 'feedback no'; }
  });
  document.getElementById('next').onclick = next;
  const bk2 = document.getElementById('back'); if (bk2) bk2.onclick = back;
}
function next() {
  const L = LESSONS[ci];
  if (si < L.steps.length - 1) { si++; renderStep(); return; }
  doneChapters.add(ci); store.set('readingtour-done', JSON.stringify([...doneChapters]));
  goChapter(ci + 1);
}
function back() { if (si > 0) { si--; renderStep(); } else if (ci > 0) { ci--; si = LESSONS[ci].steps.length - 1; renderStep(); } }

function renderFinish() {
  const fin = document.getElementById('finish'); fin.hidden = false;
  clearTimers(); S = START(); curTarget = null; renderStage();
  const items = ['Install AMS Reading Companion from TestFlight on your iPhone (and iPad and Mac if you use them). Check that iCloud Drive is on.',
    'On the Mac, open the app once and press Allow when it asks to read your book lists. Open Settings and check that Apple Books, Kindle and Kobo each say how many books they found.',
    'Open Kobo\u2019s Mac app, sign in and let it sync. Then open Reading Companion on the Mac and press Refresh in Settings.',
    'Save Amazon\u2019s page "Manage Your Content and Devices" (Books) as a PDF, then use Settings \u203a Import Kindle list.',
    'On your iPhone, wait a minute and look at the shelf: the same books should be there.',
    'Search for a book you know you own, then for one you do not. Tap the plus and try "Scan a barcode" on a real printed book.',
    'In Safari, open a book\u2019s page in a web shop, tap Share and choose AMS Reading.',
    'Open one book, press Edit under Your stars and note, give it stars and a line, and press Save.',
    'Press the funnel, tick a store and a kind, then Keep the choices as a shelf of your own.',
    'Tap the pen under What next?, write a note by typing, speaking and with a photo of a page, and press Save. Then search your notes.',
    'On an iPhone add the Home Screen widget \u201cReading\u201d. Open a book on your wish list and look at the library check.'];
  let ticks = JSON.parse(store.get('readingtour-real') || '[]');
  fin.innerHTML = `<h3>Now on your devices</h3>${items.map((t, i) => `<label><input type="checkbox" id="real-${i}" ${ticks.includes(i) ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn main-b" id="again">Start the tour again</button></div>`;
  fin.querySelectorAll('input').forEach((c, i) => c.onchange = () => { ticks = ticks.filter(x => x !== i); if (c.checked) ticks.push(i); store.set('readingtour-real', JSON.stringify(ticks)); });
  document.getElementById('again').onclick = () => goChapter(0);
}

/* Fit the 390 x 760 pretend iPhone into its box */
function fit() { const box = document.getElementById('stagebox'); document.getElementById('stage').style.transform = `scale(${box.clientWidth / 390})`; }
new ResizeObserver(fit).observe(document.getElementById('stagebox'));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.mode === 'app' && S.sh.length) { act('sheet-close'); return; }
  if (e.key === 'Enter' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') { const n = document.getElementById('next'); if (n && !n.disabled && document.activeElement !== n) n.click(); }
});
goChapter(0); fit();
</script>
